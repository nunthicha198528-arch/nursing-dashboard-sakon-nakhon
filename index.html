<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ภาพรวมพยาบาลจังหวัดสกลนคร</title><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><style>body{margin:0;background:#f2fbf5;color:#123b2a;font-family:Arial,"Noto Sans Thai",sans-serif}.app{max-width:1400px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;gap:18px;align-items:center;margin-bottom:22px}.title{font-size:clamp(25px,4vw,42px);font-weight:900}.sub{color:#668078;margin-top:5px}.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:bold;cursor:pointer;background:#dff7e7;color:#14733d}.primary{background:#16a34a;color:white}.actions{display:flex;gap:10px;flex-wrap:wrap}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:#fff;border:1px solid #dceee3;border-radius:20px;padding:20px;box-shadow:0 12px 30px #176b3210}.label{color:#668078}.value{font-size:32px;font-weight:900;margin-top:8px}.filters{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0}.input,select{width:100%;padding:12px;border:1px solid #cfe8d8;border-radius:10px;background:white}.section{margin-top:16px}.tablebox{overflow:auto;max-height:600px}.table{width:100%;border-collapse:collapse}.table th{position:sticky;top:0;background:#eaf8ef;text-align:left}.table th,.table td{padding:12px;border-bottom:1px solid #e5f0e8;white-space:nowrap}.status{margin-top:12px;padding:12px;border-radius:10px;display:none}.ok{display:block;background:#dcfce7;color:#166534}.err{display:block;background:#fee2e2;color:#991b1b}.modal{display:none;position:fixed;inset:0;background:#06351f88;place-items:center;padding:16px}.modal.show{display:grid}.modalbox{max-width:480px;width:100%;background:#fff;border-radius:20px;padding:24px}.row{margin:12px 0}.row label{display:block;font-weight:bold;margin-bottom:6px}@media(max-width:850px){.stats{grid-template-columns:repeat(2,1fr)}.filters{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.app{padding:14px}.top{display:block}.actions{margin-top:15px}.stats,.filters{grid-template-columns:1fr}.card{padding:15px}}</style></head>
<body><main class="app"><header class="top"><div><div style="color:#16a34a;font-weight:bold">NURSING OVERVIEW • SAKON NAKHON PAO</div><div class="title">ภาพรวมพยาบาลจังหวัดสกลนคร</div><div class="sub">รายชื่อพยาบาลแยกตามอำเภอ</div></div><div class="actions"><button class="btn" id="refresh">↻ รีเฟรช</button><button class="btn" id="export">⇩ ส่งออก Excel</button><button class="btn primary" id="openImport">นำเข้า Excel</button></div></header>
<section class="stats"><div class="card"><div class="label">พยาบาลทั้งหมด</div><div class="value" id="total">—</div></div><div class="card"><div class="label">อำเภอ</div><div class="value" id="districts">—</div></div><div class="card"><div class="label">หน่วยบริการ</div><div class="value" id="stations">—</div></div><div class="card"><div class="label">ยังไม่ได้บรรจุ</div><div class="value" id="unappointed">—</div></div></section>
<section class="card section"><h2>ตัวกรองข้อมูล</h2><div class="filters"><select id="district"><option value="">ทุกอำเภอ</option></select><select id="station"><option value="">ทุกหน่วยบริการ</option></select><select id="position"><option value="">ทุกตำแหน่ง</option></select><input class="input" id="search" placeholder="ค้นหาชื่อ / ลำดับ"></div><div id="status" class="status"></div></section>
<section class="card section"><div style="display:flex;justify-content:space-between"><h2>รายชื่อทั้งหมด</h2><b id="count">0 รายการ</b></div><div class="tablebox"><table class="table"><thead><tr><th>ลำดับ</th><th>อำเภอ</th><th>รพ.สต.</th><th>ชื่อ - สกุล</th><th>ตำแหน่ง</th></tr></thead><tbody id="body"></tbody></table></div></section></main>
<div class="modal" id="modal"><div class="modalbox"><h2>เข้าสู่ระบบเพื่อนำเข้า Excel</h2><div class="row"><label>Username</label><input class="input" id="username"></div><div class="row"><label>Password</label><input class="input" id="password" type="password"></div><div class="row"><label>ไฟล์ Excel</label><input class="input" id="file" type="file" accept=".xlsx,.xls"></div><div id="importStatus" class="status"></div><div class="actions" style="justify-content:flex-end;margin-top:18px"><button class="btn" id="cancel">ยกเลิก</button><button class="btn primary" id="submit">ตรวจสอบและนำเข้า</button></div></div></div>
<script>
const GAS_URL='https://script.google.com/macros/s/AKfycbxBxTqImVVb9OROub0YqzZ4gdaHazkA3L4QA26K1Zmk_-wbe0M0Hvz-tiXJNT27MJXT/exec';let data=[],shown=[];const $=x=>document.getElementById(x);const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function api(action,p={}){if(window.google?.script?.run)return new Promise((resolve,reject)=>{const r=google.script.run.withSuccessHandler(resolve).withFailureHandler(reject);action==='getData'?r.getDashboardData():r.importDashboardData(p.rows,p.username,p.password)});return fetch(GAS_URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action,...p})}).then(r=>r.json())}
function fill(id,arr,label){$(id).innerHTML='<option value="">'+label+'</option>'+[...new Set(arr)].filter(Boolean).sort((a,b)=>a.localeCompare(b,'th')).map(x=>'<option>'+esc(x)+'</option>').join('')}
function render(){const d=$('district').value,s=$('station').value,p=$('position').value,q=$('search').value.toLowerCase();shown=data.filter(x=>(!d||x.district===d)&&(!s||x.station===s)&&(!p||x.position===p)&&(!q||Object.values(x).join(' ').toLowerCase().includes(q)));$('total').textContent=data.length.toLocaleString('th-TH');$('districts').textContent=new Set(data.map(x=>x.district)).size;$('stations').textContent=new Set(data.map(x=>x.station)).size;$('unappointed').textContent=data.filter(x=>x.position.trim()==='พยาบาลวิชาชีพ').length.toLocaleString('th-TH');$('count').textContent=shown.length.toLocaleString('th-TH')+' รายการ';$('body').innerHTML=shown.map(x=>`<tr><td>${esc(x.no)}</td><td>${esc(x.district)}</td><td>${esc(x.station)}</td><td><b>${esc(x.name)}</b></td><td>${esc(x.position)}</td></tr>`).join('')||'<tr><td colspan="5">ไม่พบข้อมูล</td></tr>'}
async function load(){try{const r=await api('getData');if(!r.ok)throw Error(r.error);data=r.rows||[];fill('district',data.map(x=>x.district),'ทุกอำเภอ');fill('station',data.map(x=>x.station),'ทุกหน่วยบริการ');fill('position',data.map(x=>x.position),'ทุกตำแหน่ง');render()}catch(e){$('status').textContent=e.message;$('status').className='status err'}}
['district','station','position','search'].forEach(id=>$(id).addEventListener(id==='search'?'input':'change',render));$('refresh').onclick=load;$('openImport').onclick=()=>{$('modal').classList.add('show')};$('cancel').onclick=()=>{$('modal').classList.remove('show')};$('export').onclick=()=>{const ws=XLSX.utils.json_to_sheet(shown.map(x=>({'ลำดับ':x.no,'อำเภอ':x.district,'รพ.สต.':x.station,'ชื่อ - สกุล':x.name,'ตำแหน่ง':x.position}))),wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'รายชื่อ');XLSX.writeFile(wb,'รายชื่อพยาบาลจังหวัดสกลนคร.xlsx')};$('submit').onclick=async()=>{try{const f=$('file').files[0];if(!f)throw Error('กรุณาเลือกไฟล์ Excel');const wb=XLSX.read(await f.arrayBuffer(),{type:'array'}),raw=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''}),hi=raw.findIndex(r=>r.includes('ลำดับ'));if(hi<0)throw Error('ไม่พบหัวตาราง');const h=raw[hi].map(x=>String(x).trim()),idx=n=>h.findIndex(x=>n.includes(x));let district='';const rows=raw.slice(hi+1).map((r,i)=>{if(r[idx(['อำเภอ'])])district=String(r[idx(['อำเภอ'])]).trim();return{no:r[idx(['ลำดับ'])]||i+1,district,station:r[idx(['รพ.สต.','หน่วยบริการ'])]||'',name:r[idx(['ชื่อ - สกุล','ชื่อ-สกุล'])]||'',position:r[idx(['ตำแหน่ง'])]||''}}).filter(x=>x.name);const r=await api('importData',{rows,username:$('username').value,password:$('password').value});if(!r.ok)throw Error(r.error);alert('นำเข้าสำเร็จ '+r.count+' รายการ');$('modal').classList.remove('show');load()}catch(e){$('importStatus').textContent=e.message;$('importStatus').className='status err'}};load();
</script></body></html>
